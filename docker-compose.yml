# CTC-RAG local infrastructure stack (Phase 0 — Bootstrap).
#
# Brings up everything the project needs before any application code exists:
#   - Qdrant      : hybrid (dense + sparse) vector store
#   - Langfuse    : LLM observability via Langfuse Cloud (https://cloud.langfuse.com)
#       └─ no local containers — traces are sent to the hosted SaaS endpoint
#
# Ollama runs on the HOST (not in Docker) to avoid port conflicts and let the
# host GPU/Metal acceleration handle generation + embeddings directly.
#   - Generation model : llama3.2:3b (already pulled on the host)
#   - Embedding model  : nomic-embed-text (already pulled on the host)
# The FastAPI backend connects to Ollama at http://localhost:11434.
#
# Resource policy (project rule: minimal containers — 1 CPU, 1 GB RAM, 5 GB disk):
#   * Most services are capped at 1 CPU + 1 GB RAM.
#   * Per-container disk is governed by the Colima VM (100 GB) + named volumes;
#     Docker Compose cannot portably cap container disk, so the 5 GB guideline
#     is enforced by keeping volumes small and pruning old data.
#
# Secrets: defaults below are LOCAL-ONLY placeholders (marked # CHANGEME).
# Copy .env.example to .env and regenerate secrets for any non-local use.
# .env is gitignored.

services:
  # ─────────────────────────────── AI services ──────────────────────────────
  # Ollama is NOT containerized — it runs on the host directly.
  # The backend reaches it at http://localhost:11434 (see OLLAMA_BASE_URL).
  # Models required on the host:
  #   ollama pull llama3.2:3b          # generation
  #   ollama pull nomic-embed-text     # embeddings (768-d)

  qdrant:
    image: docker.io/qdrant/qdrant:v1.11.3
    container_name: practice-rag-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # REST / dashboard
      - "6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/localhost/6333 && echo -e \"GET /healthz HTTP/1.0\\r\\n\\r\\n\" >&3 && head -n 1 <&3 | grep -q 200'",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

  # ─────────────────────────────── FastAPI backend (Step 7) ──────────────────
  # The backend container connects to:
  #   - Qdrant  : http://qdrant:6333  (same compose network)
  #   - Ollama  : http://host.docker.internal:11434  (host Ollama, D1)
  #   - Langfuse: https://cloud.langfuse.com  (Langfuse Cloud SaaS, external)
  # The Dockerfile copies the seed corpus so /api/v1/ingest works without a
  # bind mount. The lifespan warm-up pre-loads the Ollama model on startup.
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: practice-rag-backend:latest
    container_name: practice-rag-backend
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      QDRANT_URL: http://qdrant:6333
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_WARMUP_MODEL: ${OLLAMA_WARMUP_MODEL:-llama3.2:3b}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      CORPUS_DIR: data/corpus
      # Langfuse tracing is optional — only enabled when base URL + keys are set.
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health',timeout=3).status==200 else 1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

  # ─────────────────────────────── Langfuse ─────────────────────────────────
  # Langfuse observability is now hosted on Langfuse Cloud
  # (https://cloud.langfuse.com) — no local containers are needed. The backend
  # sends traces to the cloud endpoint configured via LANGFUSE_BASE_URL +
  # LANGFUSE_PUBLIC_KEY + LANGFUSE_SECRET_KEY (see .env.example). Tracing is
  # optional and auto-disables when those env vars are unset.

volumes:
  qdrant_data:
    driver: local
